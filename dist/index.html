<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindfulness Bell Settings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .setting-group {
            margin-bottom: 20px;
        }

        .setting-group label {
            display: block;
            font-size: 13px;
            color: #999;
            margin-bottom: 8px;
        }

        .setting-group input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            background: #333;
            height: 4px;
            border-radius: 2px;
            outline: none;
        }

        .setting-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #007aff;
            border-radius: 50%;
            cursor: pointer;
        }

        .value-display {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        select {
            width: 100%;
            padding: 8px 12px;
            font-size: 14px;
            background: #333;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 6px;
            outline: none;
        }

        select:focus {
            border-color: #007aff;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toggle {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #444;
            transition: .3s;
            border-radius: 24px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        .toggle input:checked + .toggle-slider {
            background-color: #34c759;
        }

        .toggle input:checked + .toggle-slider:before {
            transform: translateX(20px);
        }

        .divider {
            height: 1px;
            background: #333;
            margin: 20px 0;
        }

        .status {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Mindfulness Bell</h1>

    <div class="setting-group">
        <div class="toggle-container">
            <label style="margin-bottom: 0;">Enable Bell</label>
            <label class="toggle">
                <input type="checkbox" id="enabled" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
    </div>

    <div class="divider"></div>

    <div class="setting-group">
        <label>Timing Mode</label>
        <select id="timingMode">
            <option value="clock-aligned">Clock-aligned (:00, :15, :30, :45)</option>
            <option value="fixed-interval">Fixed interval</option>
        </select>
    </div>

    <div class="setting-group">
        <label>Interval</label>
        <select id="interval">
            <option value="15">15 minutes</option>
            <option value="30">30 minutes</option>
            <option value="60">1 hour</option>
        </select>
    </div>

    <div class="divider"></div>

    <div class="setting-group">
        <label>Screen Opacity</label>
        <input type="range" id="opacity" min="50" max="100" value="80">
        <div class="value-display" id="opacityValue">80%</div>
    </div>

    <div class="setting-group">
        <label>Duration</label>
        <input type="range" id="duration" min="1" max="10" value="3" step="0.5">
        <div class="value-display" id="durationValue">3.0 seconds</div>
    </div>

    <div class="setting-group">
        <label>Volume</label>
        <input type="range" id="volume" min="0" max="100" value="70">
        <div class="value-display" id="volumeValue">70%</div>
    </div>

    <div class="status" id="status">
        Settings will be saved automatically
    </div>

    <script>
        // Settings management using Tauri IPC
        const { invoke } = window.__TAURI__.core;

        // DOM elements
        const enabledCheckbox = document.getElementById('enabled');
        const timingModeSelect = document.getElementById('timingMode');
        const intervalSelect = document.getElementById('interval');
        const opacitySlider = document.getElementById('opacity');
        const durationSlider = document.getElementById('duration');
        const volumeSlider = document.getElementById('volume');
        const opacityValue = document.getElementById('opacityValue');
        const durationValue = document.getElementById('durationValue');
        const volumeValue = document.getElementById('volumeValue');
        const statusDiv = document.getElementById('status');

        // Current settings object
        let currentSettings = {
            isEnabled: true,
            timingMode: 'clock-aligned',
            intervalMinutes: 15,
            opacity: 0.8,
            durationSeconds: 3.0,
            volume: 0.7,
            customSoundPath: ''
        };

        // Load settings from backend on page load
        async function loadSettings() {
            try {
                const settings = await invoke('get_settings');
                currentSettings = settings;

                // Update UI with loaded settings
                enabledCheckbox.checked = settings.isEnabled;
                timingModeSelect.value = settings.timingMode;
                intervalSelect.value = settings.intervalMinutes.toString();

                // Convert 0-1 range to percentage for UI
                opacitySlider.value = Math.round(settings.opacity * 100);
                opacityValue.textContent = opacitySlider.value + '%';

                durationSlider.value = settings.durationSeconds;
                durationValue.textContent = parseFloat(settings.durationSeconds).toFixed(1) + ' seconds';

                volumeSlider.value = Math.round(settings.volume * 100);
                volumeValue.textContent = volumeSlider.value + '%';

                statusDiv.textContent = 'Settings loaded';
                setTimeout(() => {
                    statusDiv.textContent = 'Settings will be saved automatically';
                }, 1500);
            } catch (error) {
                console.error('Failed to load settings:', error);
                statusDiv.textContent = 'Failed to load settings';
            }
        }

        // Save settings to backend
        async function saveSettings() {
            try {
                await invoke('save_settings', { settings: currentSettings });
                statusDiv.textContent = 'Settings saved';
                setTimeout(() => {
                    statusDiv.textContent = 'Settings will be saved automatically';
                }, 1500);
            } catch (error) {
                console.error('Failed to save settings:', error);
                statusDiv.textContent = 'Failed to save settings';
            }
        }

        // Debounce function to avoid excessive saves
        let saveTimeout = null;
        function debouncedSave() {
            if (saveTimeout) {
                clearTimeout(saveTimeout);
            }
            saveTimeout = setTimeout(saveSettings, 300);
        }

        // Event listeners for settings changes
        enabledCheckbox.addEventListener('change', (e) => {
            currentSettings.isEnabled = e.target.checked;
            debouncedSave();
        });

        timingModeSelect.addEventListener('change', (e) => {
            currentSettings.timingMode = e.target.value;
            debouncedSave();
        });

        intervalSelect.addEventListener('change', (e) => {
            currentSettings.intervalMinutes = parseInt(e.target.value, 10);
            debouncedSave();
        });

        opacitySlider.addEventListener('input', (e) => {
            opacityValue.textContent = e.target.value + '%';
            currentSettings.opacity = parseInt(e.target.value, 10) / 100;
            debouncedSave();
        });

        durationSlider.addEventListener('input', (e) => {
            durationValue.textContent = parseFloat(e.target.value).toFixed(1) + ' seconds';
            currentSettings.durationSeconds = parseFloat(e.target.value);
            debouncedSave();
        });

        volumeSlider.addEventListener('input', (e) => {
            volumeValue.textContent = e.target.value + '%';
            currentSettings.volume = parseInt(e.target.value, 10) / 100;
            debouncedSave();
        });

        // Load settings when page loads
        document.addEventListener('DOMContentLoaded', loadSettings);
    </script>
</body>
</html>
