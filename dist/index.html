<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindfulness Bell Settings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .setting-group {
            margin-bottom: 20px;
        }

        .setting-group label {
            display: block;
            font-size: 13px;
            color: #999;
            margin-bottom: 8px;
        }

        .setting-group input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            background: #333;
            height: 4px;
            border-radius: 2px;
            outline: none;
        }

        .setting-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #007aff;
            border-radius: 50%;
            cursor: pointer;
        }

        .value-display {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        select {
            width: 100%;
            padding: 8px 12px;
            font-size: 14px;
            background: #333;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 6px;
            outline: none;
        }

        select:focus {
            border-color: #007aff;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toggle {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #444;
            transition: .3s;
            border-radius: 24px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        .toggle input:checked + .toggle-slider {
            background-color: #34c759;
        }

        .toggle input:checked + .toggle-slider:before {
            transform: translateX(20px);
        }

        .divider {
            height: 1px;
            background: #333;
            margin: 20px 0;
        }

        .status {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Mindfulness Bell</h1>

    <div class="setting-group">
        <div class="toggle-container">
            <label style="margin-bottom: 0;">Enable Bell</label>
            <label class="toggle">
                <input type="checkbox" id="enabled" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
    </div>

    <div class="divider"></div>

    <div class="setting-group">
        <label>Timing Mode</label>
        <select id="timingMode">
            <option value="clock-aligned">Clock-aligned (:00, :15, :30, :45)</option>
            <option value="fixed-interval">Fixed interval</option>
        </select>
    </div>

    <div class="setting-group">
        <label>Interval</label>
        <select id="interval">
            <option value="15">15 minutes</option>
            <option value="30">30 minutes</option>
            <option value="60">1 hour</option>
        </select>
    </div>

    <div class="divider"></div>

    <div class="setting-group">
        <label>Screen Opacity</label>
        <input type="range" id="opacity" min="50" max="100" value="80">
        <div class="value-display" id="opacityValue">80%</div>
    </div>

    <div class="setting-group">
        <label>Duration</label>
        <input type="range" id="duration" min="1" max="10" value="3" step="0.5">
        <div class="value-display" id="durationValue">3.0 seconds</div>
    </div>

    <div class="setting-group">
        <label>Volume</label>
        <input type="range" id="volume" min="0" max="100" value="70">
        <div class="value-display" id="volumeValue">70%</div>
    </div>

    <div class="status">
        Settings will be saved automatically
    </div>

    <script>
        // Update value displays
        document.getElementById('opacity').addEventListener('input', (e) => {
            document.getElementById('opacityValue').textContent = e.target.value + '%';
        });

        document.getElementById('duration').addEventListener('input', (e) => {
            document.getElementById('durationValue').textContent = parseFloat(e.target.value).toFixed(1) + ' seconds';
        });

        document.getElementById('volume').addEventListener('input', (e) => {
            document.getElementById('volumeValue').textContent = e.target.value + '%';
        });
    </script>
</body>
</html>
